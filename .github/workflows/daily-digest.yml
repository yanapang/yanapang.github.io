name: Daily Tech Digest

on:
  schedule:
    - cron: '0 22 * * *'  # 07:00 KST (UTC+9)
  workflow_dispatch:       # 수동 실행 허용

permissions:
  contents: write

jobs:
  fetch-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install feedparser requests

      - name: Fetch digest
        run: python scripts/fetch_digest.py

      - name: Commit and push digest data
        run: |
          git config user.name "yanapang"
          git config user.email "46346904+yanapang@users.noreply.github.com"
          git add src/data/digest/ scripts/seen.json
          git diff --staged --quiet || git commit -m "digest: $(date -u +%Y-%m-%d) daily tech digest"
          git push
        # push가 deploy.yml(on: push)을 자동 트리거해서 빌드+배포까지 처리됨
